name: Update dashboard

# Her 5 dakikada bir veri ceker, dashboard.html'i yeniden uretir ve
# degisiklik varsa depoya geri yukler. GitHub Pages "main" dalindan
# yayin yaptigi icin bu push'lar siteyi otomatik gunceller.
#
# NOT: GitHub, zamanlanmis (schedule) workflow'lari yogun donemlerde
# birkac dakika geciktirebilir; "her 5 dakikada bir" GitHub'in izin
# verdigi en kisa aralik ama garanti degil. Ayrica repo 60 gun boyunca
# hic push almazsa GitHub scheduled workflow'lari otomatik durdurur -
# bu workflow'un kendisi duzenli push urettigi icin normal sartlarda
# bu duruma dusmez.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Veriyi cek
        env:
          # TCMB EVDS mevduat faiz orani opsiyoneldir. Ayarlamak icin repo
          # Settings > Secrets and variables > Actions > New repository
          # secret ile EVDS_API_KEY adinda bir secret ekleyin. Eklenmezse
          # script hata vermez, sadece "mevduat_faiz_pct" alani bos kalir.
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_data.py

      - name: Dashboard'u uret
        run: python generate_dashboard.py

      - name: Degisiklik varsa commit ve push yap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv dashboard.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlanacak."
          else
            git commit -m "Veri guncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
